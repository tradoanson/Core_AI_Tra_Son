name: v2.7.0 decision quality acceptance (GitHub only)

on:
  push:
    branches:
      - main
      - 'release/v2.7.0-decision-quality-audit'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-acceptance:
    name: install, tests, static safety / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate source and package
        run: |
          test -f pyproject.toml
          test -d core_ai_tra_son
          test -d tests
      - name: Build isolated environment and install local source
        run: |
          python -m venv .acceptance-venv
          .acceptance-venv/bin/python -m pip install --disable-pip-version-check 'setuptools>=68'
          .acceptance-venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute installed package outside repository
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.acceptance-venv/bin/python" "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Execute all tests and forbid zero tests
        run: |
          .acceptance-venv/bin/python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          n = suite.countTestCases()
          print(f"Discovered {n} tests")
          if n < 457:
              raise SystemExit(f"FAIL: expected >=457, found {n}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Verify original v0.1.0 files remain available
        run: |
          for f in README.md engine.py adaptive.py tiny_ai.py test_core.py Core_AI_Tra_Son_v0.1.0.zip; do
            test -f "$f"
          done
      - name: Inspect tracked filenames for sensitive material
        run: |
          python - <<'PY'
          import subprocess
          names = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden = (".env", ".pem", ".key", ".p12", ".pfx", "credentials.json", "id_rsa", ".sqlite3", ".db")
          exceptions = {"Core_AI_Tra_Son_v0.1.0.zip"}
          bad = [n for n in names if n not in exceptions and (n.endswith(forbidden) or n.split("/")[-1] in forbidden)]
          if bad:
              raise SystemExit(f"Forbidden tracked files: {bad}")
          print("Filename scan PASS; not a full secret scan")
          PY

  windows-native:
    name: Windows native locking tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows native locking and crash recovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_windows_learning_v1_1_0.py -v
          python -m py_compile scripts/windows_shadow_viewer.py
          python -c 'import tkinter; print("Tkinter available")'

  wheel-package:
    name: Build wheel and publish CI artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify wheel
        run: |
          python -m pip install 'setuptools>=68' wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from core_ai_tra_son.artifact_integrity import verify_wheel
          wheels=list(Path("dist").glob("*.whl"))
          if len(wheels)!=1:
              raise SystemExit("FAIL: expected exactly one wheel")
          digest=hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          assert verify_wheel(wheels[0],digest)
          Path("dist/SHA256SUMS").write_text(digest+"  "+wheels[0].name+"\\n")
          print("Wheel SHA256",digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: core-ai-tra-son-wheel-v2.7.0
          path: dist/
          if-no-files-found: error
